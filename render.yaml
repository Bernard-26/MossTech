# Render "Blueprint": New + > Blueprint > pick your GitHub repo.
# The app now stores data in PostgreSQL (the managed database below), so it no longer loses data on redeploy.
# Check Render's current plan limits for the database (free databases may expire) and pick a plan that fits.
services:
  - type: web
    name: mosstech
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "1"
      - key: REQUIRE_ADMIN_2FA
        value: "1"
      - key: ADMIN_PASSKEY
        sync: false          # you type the value in the Render dashboard
      - key: BREVO_API_KEY    # email over HTTPS (Render's free plan blocks SMTP)
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mosstech-db
          property: connectionString
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: mosstech-db
    plan: free
